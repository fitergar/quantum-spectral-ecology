[project]
name = "quantum-spectral-ecology"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "torch==2.7.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
